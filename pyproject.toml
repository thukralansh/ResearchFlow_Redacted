[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchflow"
version = "0.1.0"
description = "AI-native workspace for technical research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.2",
    "openai>=1.59,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "streamlit>=1.41,<2",
    "storage3>=2.31,<3",
    "supabase>=2.11,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/researchflow"]

[tool.mypy]
python_version = "3.12"
files = ["backend", "apps", "tests"]
mypy_path = "backend"
strict = true
namespace_packages = true
explicit_package_bases = true
pretty = true
show_error_codes = true
show_error_context = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=researchflow",
    "--cov-report=term-missing:skip-covered",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: isolated unit tests with no external services",
    "integration: tests requiring infrastructure adapters",
    "workflow: orchestration and pause/resume tests",
    "real_provider: opt-in tests that call an external provider",
]

[tool.coverage.run]
branch = true
source = ["researchflow"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["researchflow"]
